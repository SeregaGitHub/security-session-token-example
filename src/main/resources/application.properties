spring.application.name=session_security

server.port=11111

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=TRACE
logging.level.org.springframework.security.web.context=DEBUG
logging.level.org.springframework.security.web.session=DEBUG

spring.config.import=optional:file:.env[.properties]

allowed.frontend.url=http://${HOST_SERVER_IP}:12345

# --- Session cookie (JSESSIONID) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true

# in prod: true (HTTPS)
server.servlet.session.cookie.secure=false

# in prod cross-origin: None
server.servlet.session.cookie.same-site=Strict

# ??? SameSite: Strict ???????? ?????? same-origin.
# ???? ????? ? ??? ?? ?????? ?????? ? cookie ?? ?????.
# ???????: reverse proxy (Nginx) ??? None + Secure + HTTPS.

# --- only if no nginx (and if cross-origin: frontend and backend on differed ports) ---
# --- CSRF cookie ---
# in prod: None
#app.cookie.csrf-same-site=Strict  # if Synchronizer Token Pattern remove (only Double-Submit)
# in prod: true
#app.cookie.csrf-secure=false      # if Synchronizer Token Pattern remove (only Double-Submit)
